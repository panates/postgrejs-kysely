name: Feature request
description: Something this dialect should be able to do and cannot
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The problem itself, before any solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like it to do
      description: >
        If this is a PostgreJS capability Kysely has no way to ask for, say which one.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
