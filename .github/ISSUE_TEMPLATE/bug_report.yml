name: Bug report
description: A query, transaction or value that comes back wrong through this dialect
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A problem in the client underneath belongs in
        [panates/postgrejs](https://github.com/panates/postgrejs/issues). If you are not sure which
        side it is on, report it here and say so.

  - type: textarea
    id: what-happens
    attributes:
      label: What happens
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Smallest reproduction
      description: >
        The Kysely query, the table it runs against, and the result. A runnable snippet is worth
        more than a description.
      render: ts
    validations:
      required: true

  - type: input
    id: version-dialect
    attributes:
      label: kysely-postgrejs version
    validations:
      required: true

  - type: input
    id: version-kysely
    attributes:
      label: kysely version
      description: The peer range is >=0.29 <0.31.
    validations:
      required: true

  - type: input
    id: version-postgrejs
    attributes:
      label: postgrejs version
    validations:
      required: true

  - type: input
    id: version-postgres
    attributes:
      label: PostgreSQL server version
    validations:
      required: true

  - type: input
    id: version-node
    attributes:
      label: Node.js version
    validations:
      required: true

  - type: textarea
    id: anything-else
    attributes:
      label: Anything else
      description: >
        Pooling in front of the server (PgBouncer and its mode), dialect options you set, or the
        PostgreSQL error code if there was one.
