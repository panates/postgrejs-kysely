name: Test
on:
  # No secrets: every `@panates/*` dependency here answers 200 from the
  # public registry unauthenticated and the repository has no .npmrc, so
  # PERSONAL_ACCESS_TOKEN was authenticating nothing.
  workflow_call:

  # Can be run manually
  workflow_dispatch:

  # on git push
  push:
    branches:
      - dev

# This workflow only ever reads the repository: it checks out, installs and
# runs tests. Set explicitly rather than left to the repository default,
# which is org-wide and can be widened later without anyone editing here.
permissions:
  contents: read

# Only one run per branch at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node v${{ matrix.node }}, kysely ${{ matrix.kysely }}, PostgreSQL v${{ matrix.postgres }}
    strategy:
      fail-fast: false
      matrix:
        node: [ '22', '24' ]
        postgres: [ '16', '18' ]
        # The dialect's peer range is >=0.29 <0.31, so both ends of it are
        # tested: the current stable line and the next one while it is still
        # in beta.
        kysely: [ '0.29.6', '0.30.0-beta.2' ]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      # `@v2` checks the repository out itself (actions/checkout inside the
      # action), so a separate checkout step here would do it twice.
      # `install: 'ci'` installs exactly what the lockfile pins, where `@v1`
      # deleted package-lock.json first and installed whatever resolved that
      # morning. `rman-version` replaces `@v1`'s unpinned global install, and
      # pins the major rather than a release.
      - name: Setup Environment
        uses: panates/gh-setup-node@v2
        with:
          node-version: ${{ matrix.node }}
          rman-version: '2'
          install: 'ci'

      - name: Install the kysely version under test
        run: npm install --no-save kysely@${{ matrix.kysely }}

      # The preset's own commands, not npm scripts: `lint` and `check` were
      # scripts, and are commands `@panates/rman-preset` contributes now, so
      # the flags are pinned in one place - dpdm's `--exit-code circular:1`
      # above all, without which it reports a cycle and still exits 0.
      - name: Run linter test
        run: rman lint

      - name: Run circular dependency test
        run: rman check

      # Still a script: the preset builds with `tsc -b` and contributes no
      # typecheck command, and this is the no-emit half of the same thing.
      - name: Run type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run citest
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres

      - name: Send coverage to Coveralls
        uses: coverallsapp/github-action@v2
        # Run only once
        if: ${{ matrix.node == '22' && matrix.postgres == '18' && matrix.kysely == '0.29.6' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
