name: Kysely dialect suite
on:
  # Can be run manually
  workflow_dispatch:

  # Weekly, to notice a change in Kysely rather than in this repository
  schedule:
    - cron: '0 6 * * 1'

# Only one run at a time
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  suite:
    name: Kysely ${{ matrix.kysely }}
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the peer range. The suite passes outright on both;
        # this job exists to notice the day it stops.
        include:
          - kysely: v0.29.6
            expected-failures: 0
          - kysely: v0.30.0-beta.2
            expected-failures: 0
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # `@v2` checks out itself, installs from the lockfile and puts rman on
      # the PATH - which the suite script needs, since it builds this dialect
      # with `rman build` before pointing Kysely at it.
      - name: Setup Environment
        uses: panates/gh-setup-node@v2
        with:
          node-version: '22'
          rman-version: '2'
          install: 'ci'

      - name: Run Kysely's dialect suite against this dialect
        run: scripts/run-kysely-suite.sh
        env:
          KYSELY_VERSION: ${{ matrix.kysely }}
          EXPECTED_FAILURES: ${{ matrix.expected-failures }}
          WORK_DIR: ${{ runner.temp }}/kysely-suite
