name: Quality Check
on:
  # Can be run manually
  workflow_dispatch:

  # on pull request
  push:
    branches-ignore:
      - main
      - dev

# Only one run per branch at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qc:
    uses: panates/github-actions/.github/workflows/node-qc.yaml@v3
    # On the calling job: that is what governs a reusable workflow's permissions, and this one only
    # ever reads the repository.
    permissions:
      contents: read
    with:
      # The default is `npm run qc`, and that script is gone - lint and check are commands the
      # preset contributes now, so there is nothing left for a script to wrap.
      qc_script: 'rman lint && rman check'
