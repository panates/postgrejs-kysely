extends: '@panates/rman-preset'

# This package has shipped its CHANGELOG.md in the tarball since 1.0.0, on
# top of the README.md and LICENSE the preset's build copies. A selector
# block, because the preset declares the build under `[platform:node]` >
# `[*]` and an unmarked key here would be layered below it.
'[*]':
  run:
    build:
      vars:
        copyFiles: "${{ [...value, 'CHANGELOG.md'] }}"
